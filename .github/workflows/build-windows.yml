name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    name: 构建剪映字幕助手 Windows 安装包

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller build_win.spec --clean --noconfirm

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --limit-output

      - name: Inno Setup 生成安装包
        shell: powershell
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "找不到 ISCC.exe，请确认 Inno Setup 已安装"
            exit 1
          }
          Write-Host "找到 ISCC: $($iscc.FullName)"
          & $iscc.FullName installer.iss

      - name: 上传便携版 (免安装)
        uses: actions/upload-artifact@v4
        with:
          name: 剪映字幕助手_v1.5.0_portable
          path: dist\剪映字幕助手\

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 剪映字幕助手_v1.5.0_Setup
          path: Output\*.exe
